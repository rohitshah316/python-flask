<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
</head>
<body>

<h1>My Blog</h1>
<a href="{{url_for('create_post')}}">Create Post</a>

    {% for post in posts %}
        <h2><a href="{{url_for('view_post',post_id=post.id)}}">
            {{ post.title }}
        </a></h2>
         <p>{{ post.content }}</p>
    {% endfor %}

</body>
</html>
